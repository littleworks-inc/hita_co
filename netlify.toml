# ✅ CORRECTED Netlify Configuration - Preserves Customer Portal
# netlify.toml

[build]
  command = "npm install && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_ENV = "production"

# ✅ ESSENTIAL: Next.js plugin for proper server-side rendering
[[plugins]]
  package = "@netlify/plugin-nextjs"

# ✅ FIXED: Correct redirects preserving customer portal
# Handle Next.js internal files
[[redirects]]
  from = "/_next/*"
  to = "/_next/:splat"
  status = 200

# Handle API routes - these go to Netlify functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/nextjs"
  status = 200

# ✅ REMOVED: No root redirect - let customer homepage work normally
# The root "/" should show customer portal, not redirect to admin

# Handle admin routes (but preserve customer routes)
[[redirects]]
  from = "/admin"
  to = "/admin/login"
  status = 302

# Handle exhibition routes
[[redirects]]
  from = "/exhibition"
  to = "/exhibition/login"
  status = 302

# ✅ CATCH-ALL: Final fallback for client-side routing
[[redirects]]
  from = "/*"
  to = "/404"
  status = 404
  force = false

# ✅ SECURITY: Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"

# ✅ FUNCTIONS: Configuration for serverless functions
[functions]
  node_bundler = "esbuild"
  included_files = ["prisma/**"]