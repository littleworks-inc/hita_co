[build]
  # Build command with connection-safe Prisma generation
  command = "SKIP_DB_ON_BUILD=true prisma generate && npm run build"

  # Publish directory
  publish = ".next"

[build.environment]
  # Match the Node version Netlify is already building with in production
  # (was pinned to 18 here, which never actually applied since this file
  # had the wrong name until now - don't downgrade a working build)
  NODE_VERSION = "22"

  # Disable Next.js telemetry for faster builds
  NEXT_TELEMETRY_DISABLED = "1"

  # Prisma configuration for serverless
  PRISMA_GENERATE_SKIP_AUTOINSTALL = "true"

# NOTE: deliberately NOT setting NODE_ENV=production here. Doing so makes
# `npm install` skip devDependencies during the build step (autoprefixer,
# eslint, etc. all live there), which broke the build the moment this file
# was actually read for the first time (see deploy 6a5d55ff). Netlify's
# Next.js Runtime already sets the correct NODE_ENV for the deployed
# function at runtime without this override.

# Build-specific settings for preview deployments
[context.deploy-preview]
  command = "prisma generate && npm run build"

# Build-specific settings for branch deployments  
[context.branch-deploy]
  command = "prisma generate && npm run build"

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"